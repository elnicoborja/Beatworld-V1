openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BeatWorld game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Game data operations
  - name: social
    description: Social platform operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /game/save:
    post:
      operationId: saveGame
      tags: [game]
      summary: Save game progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSaveRequest"
      responses:
        "200":
          description: Game saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSaveResponse"

  /game/load/{playerId}:
    get:
      operationId: loadGame
      tags: [game]
      summary: Load game progress
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Game data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSaveResponse"
        "404":
          description: No save found

  /social/posts:
    get:
      operationId: listPosts
      tags: [social]
      summary: List social posts
      parameters:
        - name: limit
          in: query
          schema:
            type: number
        - name: offset
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Posts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsResponse"
    post:
      operationId: createPost
      tags: [social]
      summary: Create a social post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /social/posts/{postId}/rate:
    post:
      operationId: ratePost
      tags: [social]
      summary: Rate a track post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRequest"
      responses:
        "200":
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /social/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [social]
      summary: Get clout leaderboard
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GameSaveRequest:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        currentLevel:
          type: number
        currentCity:
          type: string
        completedCities:
          type: array
          items:
            type: string
        clout:
          type: number
        character:
          type: object
          additionalProperties: true
        tracks:
          type: object
          additionalProperties: true
      required:
        - playerId
        - playerName
        - currentLevel
        - currentCity
        - completedCities
        - clout

    GameSaveResponse:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        playerName:
          type: string
        currentLevel:
          type: number
        currentCity:
          type: string
        completedCities:
          type: array
          items:
            type: string
        clout:
          type: number
        character:
          type: object
          additionalProperties: true
        tracks:
          type: object
          additionalProperties: true
        savedAt:
          type: string
      required:
        - id
        - playerId
        - playerName
        - currentLevel
        - currentCity
        - completedCities
        - clout
        - savedAt

    Post:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        playerName:
          type: string
        characterSprite:
          type: string
        city:
          type: string
        genre:
          type: string
        trackData:
          type: object
          additionalProperties: true
        screenshot:
          type: string
        caption:
          type: string
        cloutRating:
          type: number
        ratingCount:
          type: number
        createdAt:
          type: string
      required:
        - id
        - playerId
        - playerName
        - city
        - genre
        - cloutRating
        - ratingCount
        - createdAt

    CreatePostRequest:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        characterSprite:
          type: string
        city:
          type: string
        genre:
          type: string
        trackData:
          type: object
          additionalProperties: true
        screenshot:
          type: string
        caption:
          type: string
      required:
        - playerId
        - playerName
        - city
        - genre

    RateRequest:
      type: object
      properties:
        playerId:
          type: string
        rating:
          type: number
      required:
        - playerId
        - rating

    PostsResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: number
      required:
        - posts
        - total

    LeaderboardEntry:
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        characterSprite:
          type: string
        clout:
          type: number
        completedCities:
          type: number
      required:
        - playerId
        - playerName
        - clout
        - completedCities

    LeaderboardResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required:
        - entries
