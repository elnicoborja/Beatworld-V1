<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat World 2.0 — Vibe Jam 2026</title>
  <meta name="description" content="Produce beats across 20 cities worldwide. A music production game for Vibe Jam 2026." />
  <meta property="og:title" content="Beat World 2.0" />
  <meta property="og:description" content="Produce beats across 20 cities worldwide." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1e; }
    #game-canvas { width: 100%; height: 100%; display: block; }
    #ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; font-family: 'Press Start 2P', monospace;
      color: #fff; z-index: 10;
    }
    #ui-overlay * { pointer-events: auto; }
    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0a1e; z-index: 100; transition: opacity 0.5s;
      font-family: 'Press Start 2P', monospace; color: #ffaa00;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-screen h1 { font-size: 24px; margin-bottom: 20px; text-shadow: 2px 2px 0 #ff3399; }
    #loading-screen .bar-outer {
      width: 300px; height: 20px; border: 2px solid #ffaa00;
      background: #1a1a3e; position: relative;
    }
    #loading-screen .bar-inner {
      height: 100%; background: linear-gradient(90deg, #ff3399, #ffaa00);
      width: 0%; transition: width 0.3s;
    }
    #loading-screen .hint {
      margin-top: 16px; font-size: 8px; color: #888; animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* HUD */
    #hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      font-size: 8px; pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    .hud-box {
      background: rgba(0,0,0,0.7); border: 1px solid #ffaa00;
      padding: 8px 12px; backdrop-filter: blur(4px);
    }
    .hud-label { color: #888; font-size: 6px; margin-bottom: 2px; }
    .hud-value { color: #ffaa00; }

    /* Buttons */
    .pixel-btn {
      font-family: 'Press Start 2P', monospace; font-size: 8px;
      padding: 10px 18px; border: 2px solid #111;
      cursor: pointer; position: relative;
      box-shadow: 3px 3px 0 #111; transition: all 0.1s;
      text-transform: uppercase;
    }
    .pixel-btn:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #111; }
    .pixel-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #111; }
    .pixel-btn.primary { background: #ffaa00; color: #111; }
    .pixel-btn.secondary { background: #003399; color: #fff; }
    .pixel-btn.danger { background: #cc3300; color: #fff; }
    .pixel-btn.magenta { background: #ff3399; color: #fff; }
    .pixel-btn.cyan { background: #00ddff; color: #111; }
    .pixel-btn.dim { background: #1a1a3e; color: #555; cursor: not-allowed; box-shadow: 2px 2px 0 #000; }
    .pixel-btn.dim:hover { transform: none; box-shadow: 2px 2px 0 #000; }

    /* Asset placeholder — appears when a sprite file is missing */
    .sprite-placeholder {
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 0, 255, 0.10);
      border: 2px dashed #ff00ff;
      color: #ff00ff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px; line-height: 1.4;
      text-align: center; padding: 8px;
      box-sizing: border-box;
    }

    /* Full-screen scene container (used by every overlay scene) */
    .scene-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      overflow: hidden;
    }
    .scene-overlay .scene-body {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; align-items: center;
    }
    .scene-overlay h1.scene-title {
      font-size: 22px; color: #ff3399; text-shadow: 0 0 12px #ff3399, 2px 2px 0 #000;
      margin-bottom: 8px; letter-spacing: 2px;
    }
    .scene-overlay h2.scene-subtitle {
      font-size: 9px; color: #00ddff; margin-bottom: 24px; letter-spacing: 1px;
    }

    /* Shared SOUND OS footer */
    .sound-os-footer {
      position: absolute; bottom: 6px; left: 0; right: 0;
      text-align: center; font-family: 'Press Start 2P', monospace;
      font-size: 6px; color: #555; pointer-events: auto; z-index: 50;
    }
    .sound-os-footer a {
      color: #888; text-decoration: none; transition: color 0.2s;
    }
    .sound-os-footer a:hover { color: #ff3399; }

    /* Neon text helpers */
    .neon-magenta { color: #ff3399; text-shadow: 0 0 8px #ff3399; }
    .neon-cyan    { color: #00ddff; text-shadow: 0 0 8px #00ddff; }
    .neon-yellow  { color: #ffaa00; text-shadow: 0 0 8px #ffaa00; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>BEAT WORLD 2.0</h1>
    <div class="bar-outer"><div class="bar-inner" id="load-bar"></div></div>
    <p class="hint">CLICK ANYWHERE TO START</p>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay">
    <div id="hud" style="display:none;">
      <div class="hud-box">
        <div class="hud-label">PRODUCER</div>
        <div class="hud-value" id="hud-name">—</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">CLOUT</div>
        <div class="hud-value" id="hud-clout">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">CITY</div>
        <div class="hud-value" id="hud-city">WORLD MAP</div>
      </div>
    </div>
    <div id="screen-container"></div>
  </div>
  <!-- Vibe Jam 2026 Portal Widget -->
  <script async src="https://vibejam.cc/2026/widget.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
